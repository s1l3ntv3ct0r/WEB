{
  "openapi": "3.0.3",
  "info": {
    "title": "ShopLab API",
    "version": "0.1.0",
    "description": "Functional baseline. Money is returned as integer VND strings. Private resources owned by someone else return 404. Responses are wrapped in success/data or success/error/requestId."
  },
  "servers": [
    {
      "url": "http://localhost:5173/api",
      "description": "Local Vite proxy"
    },
    {
      "url": "http://localhost:8080/api",
      "description": "Docker gateway"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "refreshCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "shoplab_refresh"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "error": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message"
            ]
          },
          "requestId": {
            "type": "string"
          }
        },
        "required": [
          "success",
          "error",
          "requestId"
        ]
      },
      "Login": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string"
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "Register": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "username": {
            "type": "string",
            "pattern": "^[a-z0-9_]{3,30}$"
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 72
          }
        },
        "required": [
          "email",
          "username",
          "password"
        ]
      },
      "Review": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "rating": {
            "type": "integer",
            "minimum": 1,
            "maximum": 5
          },
          "content": {
            "type": "string",
            "minLength": 3,
            "maxLength": 2000
          }
        },
        "required": [
          "rating",
          "content"
        ]
      },
      "Product": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 120
          },
          "description": {
            "type": "string",
            "minLength": 5,
            "maxLength": 5000
          },
          "price": {
            "type": "string",
            "pattern": "^[0-9]{1,12}$"
          },
          "stock": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000
          },
          "category": {
            "type": "string"
          },
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "name",
          "description",
          "price",
          "stock",
          "category"
        ]
      },
      "Coupon": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "percent": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "maxUses": {
            "type": "integer",
            "minimum": 1
          },
          "perUserLimit": {
            "type": "integer",
            "minimum": 1
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "percent",
          "maxUses",
          "perUserLimit",
          "expiresAt"
        ]
      }
    }
  },
  "paths": {
    "/health": {
      "get": {
        "summary": "Database readiness",
        "tags": [
          "health"
        ],
        "security": [],
        "responses": {
          "200": {
            "description": "Successful operation.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "success": {
                      "type": "boolean",
                      "enum": [
                        true
                      ]
                    },
                    "data": {
                      "type": "object",
                      "additionalProperties": true
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Validation or business rule rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "No active session"
          },
          "403": {
            "description": "Insufficient role or rejected Origin"
          },
          "404": {
            "description": "Missing or inaccessible resource"
          },
          "409": {
            "description": "Conflict, stock, duplicate or invalid state transition"
          },
          "429": {
            "description": "Authentication/reset rate limit"
          },
          "500": {
            "description": "Unexpected server error; use requestId to correlate logs"
          }
        }
      }
    },
