name: baseline-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: shoplab
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: shoplab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U shoplab -d shoplab_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shoplab:ci_only_password@localhost:5432/shoplab_test
      JWT_SECRET: ci_only_secret_at_least_32_characters_not_for_deployment
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test
      UPLOAD_DIR: /tmp/shoplab-ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @shoplab/api exec prisma migrate deploy
      - run: pnpm --filter @shoplab/api test:unit
      - run: pnpm --filter @shoplab/api test:integration
      - run: pnpm build
